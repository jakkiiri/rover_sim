swerve_controller:
  ros__parameters:
    command_timeout: 0.5    # monotonic wall seconds; 0 inhibits drive
    feedback_timeout: 0.5   # simulation seconds; 0 inhibits drive
    max_wheel_speed: 8.0    # rad/s, below the URDF no-load speed (10)
    wheel_acceleration: 6.0
    alignment_tolerance: 0.08
